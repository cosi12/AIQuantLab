[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiquantlab"
version = "0.1.0"
description = "A correctness-first quantitative market research framework."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AIQuantLab contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15,<24",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
research = [
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "httpx>=0.27,<1",
    "hypothesis>=6.100,<7",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.2,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiquantlab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src", "web/backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 把全角标点判为易混淆字符。Web 层的文档、注释与面向研究者的中文
# 文案本就应使用全角标点，这些告警在本项目中全是误报。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "web/backend"]
packages = ["aiquantlab", "aiquantlab_web"]
